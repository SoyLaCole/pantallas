<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantallas La Cole</title>
<link rel="icon" href="/static/icon.png"><link rel="stylesheet" href="/static/fonts.css">
<style>
:root{--p:#800cab;--p2:#5e0880;--pl:#f6eefb;--bg:#f5f4f7;--card:#fff;--tx:#23202a;--mut:#6d6877;--bd:#e4e0ea;--ok:#1f9d55;--warn:#d98a00;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;letter-spacing:-.003em}
button,input,select{font-family:inherit}
header{background:var(--p);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;position:sticky;top:0;z-index:5}
header img{height:34px;display:block}
header .sep{width:1px;height:26px;background:#fff6}
header h1{font-size:16px;margin:0;font-weight:700;flex:1;letter-spacing:-.01em}
header .me{font-size:12px;opacity:.9}
header a{color:#fff;font-size:12px;opacity:.85}
nav{display:flex;gap:4px;padding:14px 22px 0;max-width:1360px;margin:auto}
nav button{border:0;background:none;padding:10px 18px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p)}
main{max-width:1360px;margin:auto;padding:16px 22px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--tx)}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p2);color:#fff}
.btn.bad{color:var(--bad)}.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
h2{font-size:16px;margin:18px 0 10px;font-weight:800;letter-spacing:-.01em}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px #1f9d5530}
.scr h3{margin:0;font-size:16px;font-weight:800}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;margin:12px 0;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.now{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1.5px solid var(--bd);background:#faf9fb;font-size:13px;margin-top:12px}
.now.live{border-color:var(--ok);background:#f0faf4}
.now .lamp{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.now.live .lamp{background:var(--ok);box-shadow:0 0 0 3px #1f9d5533}
.now .lbl{color:var(--mut);flex:none}.now .ttl{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code.cp{cursor:pointer;background:#f3f1f6;padding:1px 6px;border-radius:6px}
code.cp:hover{outline:1px solid var(--p)}
pre.cmd{background:#f3f1f6;padding:10px 12px;border-radius:8px;margin:6px 0 10px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--pl);color:var(--p)}
.badge.ok{background:#e3f6ea;color:var(--ok)}.badge.warn{background:#fff3d6;color:var(--warn)}
.badge.bad{background:#fde7e7;color:var(--bad)}.badge.gray{background:#eee;color:#666}
.pending{border:2px dashed var(--p);background:var(--pl)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600}
td .t{font-weight:700}td .s{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut);margin-bottom:14px;background:#fff}
.drop.over{border-color:var(--p);background:var(--pl)}
.modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);padding:22px}
.modal h3{margin:0 0 14px;font-size:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=url],input[type=number],input[type=datetime-local],input[type=time],select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--p);border-color:var(--p)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--tx);margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.sched{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.sched label.d{display:inline-flex;align-items:center;gap:3px;margin:0;font-weight:500;color:var(--tx);font-size:12px}
.prog{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:8px;display:none}
.prog i{display:block;height:100%;background:var(--p);width:0}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;z-index:50;display:none}
.arrows button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 4px;font-size:12px}
.arrows button:hover{color:var(--p)}
.th{width:128px;height:72px;border-radius:10px;background:#16121b;object-fit:contain;display:block;flex:none;border:1px solid var(--bd)}
.th.ph{display:grid;place-items:center;color:#9d93ab}
.th.ph svg{width:28px;height:28px}
.fbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.fbcard{display:flex;gap:14px;align-items:flex-start}
.fbcard .th{width:160px;height:90px}
.fbcard h3{margin:0 0 4px;font-size:15px;font-weight:800}
.note{background:var(--pl);border-radius:10px;padding:12px 14px;color:#4b3a58;font-size:13px;margin-bottom:14px;line-height:1.5}
.cell{display:flex;align-items:center;gap:12px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ccard{padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ctop{display:flex;gap:10px;min-width:0}
.cthumb{position:relative;flex:none;width:104px}
.cthumb .th{width:104px;height:auto;aspect-ratio:16/9;border-radius:8px}
.cthumb .th.ph svg{width:24px;height:24px}
.cbody{flex:1;min-width:0}
.ct{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{font-size:11.5px;color:var(--mut);margin:1px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbadges{display:flex;gap:4px;flex-wrap:wrap}
.cbadges .badge{font-size:10.5px;padding:1px 7px}
.ci{display:flex;gap:6px;font-size:11.5px;line-height:1.5;min-width:0}
.ci span{color:var(--mut);flex:none}
.ci b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cact{display:flex;align-items:center;gap:6px}
@media(max-width:1100px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.cgrid{grid-template-columns:1fr}}
@media(max-width:700px){th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<header>
  <img src="/static/logo_white.png" alt="Colegiatura Antioqueña de Belleza">
  <span class="sep"></span>
  <h1>Panel de pantallas</h1>
  <span class="me" id="me"></span>
  <a href="/logout">Salir</a>
</header>
<nav>
  <button id="t-screens" class="on" onclick="tab('screens')">Pantallas</button>
  <button id="t-contents" onclick="tab('contents')">Contenido</button>
  <button id="t-fallback" onclick="tab('fallback')">Respaldo</button>
  <button id="t-app" onclick="tab('app')">Aplicación</button>
</nav>
<main>
  <section id="v-screens"></section>
  <section id="v-contents" style="display:none"></section>
  <section id="v-fallback" style="display:none"></section>
  <section id="v-app" style="display:none"></section>
</main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
let S={screens:[],contents:[],now:0};
let TAB='screens';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORI={0:'Horizontal',90:'Vertical (girada a la derecha)',270:'Vertical (girada a la izquierda)',180:'Horizontal invertida'};
const DAYS=['L','M','X','J','V','S','D'];

async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'X-Requested-With':'panel','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location='/login';throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('Error '+r.status));
  return j;
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function tab(t){TAB=t;for(const x of['screens','contents','fallback','app']){$('v-'+x).style.display=x===t?'':'none';$('t-'+x).classList.toggle('on',x===t)}render()}
function fmt(ts){return ts?new Date(ts*1000).toLocaleString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function ago(ts){if(!ts)return 'nunca';const d=Date.now()/1000-ts;if(d<60)return 'hace unos segundos';if(d<3600)return 'hace '+Math.round(d/60)+' min';if(d<86400)return 'hace '+Math.round(d/3600)+' h';return 'hace '+Math.round(d/86400)+' d'}
function toLocalInput(ts){if(!ts)return '';const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function fromLocalInput(v){return v?Math.floor(new Date(v).getTime()/1000):null}

async function load(){
  try{S=await api('GET','/api/admin/state');$('me').textContent=S.me;
    if(!$('mbg').classList.contains('show'))if(!(TAB==='app'&&APPUP))render();backfill()}catch(e){}
}

/* ---------------- Pantallas ---------------- */
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado: '+t),()=>toast(t))}catch(e){toast(t)}}
function renderScreens(){
  const pend=S.screens.filter(s=>s.status==='pending'),ok=S.screens.filter(s=>s.status==='approved');
  let h='';
  if(pend.length){
    h+='<h2>Pantallas nuevas por aprobar</h2><div class="grid">'+pend.map(s=>`
      <div class="card pending scr"><div class="row"><span class="dot ${s.online?'on':''}"></span><h3>${esc(s.name)}</h3></div>
      <div class="kv"><span>Código</span><span>${esc(s.id.slice(0,8))}</span><span>Equipo</span><span>${esc(s.model||'—')} ${s.android?'· Android '+esc(s.android):''}</span><span>Red</span><span>${esc(s.ip||'—')}</span><span>Visto</span><span>${ago(s.last_seen)}</span></div>
      <div class="row"><button class="btn pri" onclick="approveModal('${s.id}')">Aprobar</button><button class="btn bad" onclick="delScreen('${s.id}')">Rechazar</button></div></div>`).join('')+'</div>';
  }
  h+='<h2>Pantallas ('+ok.length+')</h2>';
  if(!ok.length)h+='<div class="card empty">Aún no hay pantallas aprobadas.<br>Instala la app en un TV; aparecerá arriba para que la apruebes.</div>';
  else h+='<div class="grid">'+ok.map(s=>`
    <div class="card scr"><div class="row"><span class="dot ${s.online?'on':''}"></span><h3>${esc(s.name)}</h3><span class="sp"></span><span class="badge ${s.online?'ok':'gray'}">${s.online?'En línea':'Sin conexión'}</span></div>
    <div class="now ${s.online&&s.now_title?'live':''}"><span class="lamp"></span><span class="lbl">Reproduce</span><span class="ttl">${s.online?esc(s.now_title||'—'):'—'}</span></div>
    <div class="kv"><span>Orientación</span><span>${s.orientation===0?'Horizontal':'Vertical'}</span>
    <span>IP en la red</span><span>${s.lan_ip?`<code class="cp" title="Clic para copiar el comando de conexión" onclick="copyText('adb connect ${esc(s.lan_ip)}:5555')">${esc(s.lan_ip)}</code>`:'<span style="color:var(--mut)">se mostrará al actualizar la app</span>'}</span>
    <span>Estado</span><span>${esc(s.state||'—')}</span>
    <span>Espacio libre</span><span>${s.free_mb!=null?(s.free_mb>=1024?(s.free_mb/1024).toFixed(1)+' GB':s.free_mb+' MB'):'—'}</span>
    <span>Equipo</span><span>${esc(s.model||'—')} ${s.android?'· Android '+esc(s.android):''} ${s.app?'· app '+esc(s.app):''}</span>
    <span>Visto</span><span>${ago(s.last_seen)}${s.ip?' · '+esc(s.ip):''}</span>
    <span>Sincronizó</span><span>${s.last_sync?ago(s.last_sync):'—'}</span></div>
    <div class="row" style="flex-wrap:wrap"><button class="btn sm bad" onclick="delScreen('${s.id}')">Quitar</button>
    <button class="btn sm" onclick="cmd('${s.id}','reload')">Reiniciar</button>
    <span class="sp"></span><button class="btn pri" onclick="editScreen('${s.id}')">Editar</button></div></div>`).join('')+'</div>';
  $('v-screens').innerHTML=h;
}
async function cmd(id,c){try{await api('POST','/api/admin/screens/'+id+'/cmd',{cmd:c});toast('Reinicio enviado');}catch(e){toast(e.message)}}
async function delScreen(id){const s=S.screens.find(x=>x.id===id);if(!confirm('¿Quitar la pantalla "'+s.name+'"?'))return;await api('DELETE','/api/admin/screens/'+id);load()}

function oriSelect(v){return `<select id="f-ori">${[[0,'Horizontal'],[90,'Vertical – giro horario (90°)'],[270,'Vertical – giro antihorario (270°)'],[180,'Horizontal invertida']].map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select>`}
function approveModal(id){
  const s=S.screens.find(x=>x.id===id);
  openModal(`<h3>Aprobar pantalla</h3><label>Nombre</label><input type="text" id="f-name" value="${esc(s.name)}" placeholder="Ej.: Recepción piso 2">
  <label>Orientación</label>${oriSelect(s.orientation)}
  <div class="hint">Si el TV está de lado, elige un giro vertical. Si se ve de cabeza, cambia al otro giro vertical.</div><div class="err" id="err"></div>
  <div class="row" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="doApprove('${id}')">Aprobar</button></div>`);
}
async function doApprove(id){try{await api('POST','/api/admin/screens/'+id+'/approve',{name:$('f-name').value,orientation:+$('f-ori').value});closeModal();load()}catch(e){$('err').textContent=e.message}}
function editScreen(id){
  const s=S.screens.find(x=>x.id===id);
  openModal(`<h3>Editar pantalla</h3><label>Nombre</label><input type="text" id="f-name" value="${esc(s.name)}">
  <label>Orientación</label>${oriSelect(s.orientation)}
  <div class="err" id="err"></div>
  <div class="row" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="saveScreen('${id}')">Guardar</button></div>`);
}
async function saveScreen(id){try{await api('PATCH','/api/admin/screens/'+id,{name:$('f-name').value,orientation:+$('f-ori').value,sleep:[]});closeModal();load()}catch(e){$('err').textContent=e.message}}

/* ---------------- Contenido ---------------- */
function statusOf(c){
  if(c.fallback)return['Respaldo','gray'];
  const n=S.now;
  if(c.end_at&&c.end_at<n)return['Vencido','bad'];
  if(c.start_at&&c.start_at>n)return['Programado','warn'];
  return['Activo','ok'];
}
const TYPES={video:'Video',image:'Imagen',web:'Página web'};
const OGRP={0:'Horizontales',90:'Verticales 90°',270:'Verticales 270°',180:'Horizontales invertidas'};
function targetText(c){if(!c.targets)return 'Todas las pantallas';const names=c.targets.map(id=>id.startsWith('ori:')?'Todas las '+OGRP[+id.slice(4)].toLowerCase():(S.screens.find(s=>s.id===id)||{}).name).filter(Boolean);return names.length?names.join(', '):'Ninguna pantalla'}
const ICON={video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
 image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>',
 web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>'};
function thumbHtml(c){
  if(c.thumb)return `<img class="th" alt="" src="/api/admin/contents/${c.id}/thumb?v=${c.thumb}">`;
  return `<div class="th ph">${ICON[c.type]||''}</div>`;
}
function renderContents(){
  const list=S.contents.filter(c=>!c.fallback);
  let h=`<div class="drop" id="drop">Arrastra aquí videos o imágenes, o <button class="btn pri sm" onclick="contentModal()">+ Agregar contenido</button></div>`;
  if(!list.length)h+='<div class="card empty">No hay contenido todavía.</div>';
  else h+='<div class="cgrid">'+list.map((c,i)=>{
    const st=statusOf(c);
    const sched=(c.start_at||c.end_at)?(c.start_at?fmt(c.start_at):'Ya')+' → '+(c.end_at?fmt(c.end_at):'sin fin'):'Indefinida';
    const meta=c.type==='web'?(c.url||''):(c.type==='image'?c.duration+' s':'')+(c.size?(c.type==='image'?' · ':'')+(c.size/1048576).toFixed(1)+' MB':'');
    return `<div class="card ccard"><div class="ctop"><div class="cthumb">${thumbHtml(c)}</div>
    <div class="cbody"><div class="ct" title="${esc(c.title)}">${esc(c.title)}</div>
    <div class="cm">${meta?esc(meta)+(c.interactive?' · interactiva':''):(c.interactive?'Interactiva':'&nbsp;')}</div>
    <div class="cbadges"><span class="badge">${TYPES[c.type]}</span><span class="badge ${st[1]}">${st[0]}</span></div></div></div>
    <div><div class="ci"><span>Publicación</span><b title="${esc(sched)}">${esc(sched)}</b></div>
    <div class="ci"><span>Pantallas</span><b title="${esc(targetText(c))}">${esc(targetText(c))}</b></div></div>
    <div class="cact"><span class="arrows"><button title="Mover antes" onclick="move('${c.id}','up')" ${i?'':'disabled'}>◀</button><button title="Mover después" onclick="move('${c.id}','down')" ${i<list.length-1?'':'disabled'}>▶</button></span><span class="sp"></span><button class="btn sm" onclick="contentModal('${c.id}')">Editar</button><button class="btn sm bad" onclick="delContent('${c.id}')">Eliminar</button></div></div>`}).join('')+'</div>';
  $('v-contents').innerHTML=h;
  const d=$('drop');
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files[0])contentModal(null,e.dataTransfer.files[0])};
}
function renderFallback(){
  const list=S.contents.filter(c=>c.fallback);
  let h=`<div class="note"><b>¿Qué es el contenido de respaldo?</b><br>Es lo que una pantalla muestra cuando no tiene nada programado para ese momento, para que nunca se quede en negro. Puedes subir uno para todas las pantallas o uno distinto para algunas.</div>
  <div class="row" style="margin-bottom:14px"><button class="btn pri" onclick="contentModal(null,null,'fb')">+ Subir contenido de respaldo</button></div>`;
  if(!list.length)h+='<div class="card empty">Aún no hay contenido de respaldo.</div>';
  else h+='<div class="fbgrid">'+list.map(c=>`<div class="card fbcard">${thumbHtml(c)}<div style="flex:1;min-width:0">
    <h3>${esc(c.title)}</h3><div class="s" style="font-size:12px;color:var(--mut);margin-bottom:10px"><span class="badge">${TYPES[c.type]}</span> ${esc(targetText(c))}${c.size?' · '+(c.size/1048576).toFixed(1)+' MB':''}</div>
    <div class="row"><button class="btn sm" onclick="contentModal('${c.id}')">Editar</button><button class="btn sm bad" onclick="delContent('${c.id}')">Eliminar</button></div></div></div>`).join('')+'</div>';
  $('v-fallback').innerHTML=h;
}
/* ---------------- Aplicación (actualización de los TV) ---------------- */
let APPUP=false;
function bytes(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}
function renderApp(){
  const r=S.release,scr=S.screens.filter(s=>s.status==='approved');
  let h=`<div class="note"><b>Actualización automática de la app de los televisores</b><br>Sube aquí la nueva versión (el archivo <code>app-debug.apk</code> que compila Android Studio). Los televisores que ya tienen activada la instalación automática la descargan e instalan solos en pocos minutos, sin que tengas que visitarlos. La versión debe tener un <b>versionCode</b> mayor que la instalada.</div>
  <div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:14px">
  <div style="flex:1;min-width:240px"><div style="font-weight:800;font-size:15px">Versión publicada</div>
  <div class="s" style="font-size:13px;color:var(--mut);margin-top:4px">${r?esc(r.orig_name)+' · '+bytes(r.size)+' · '+fmt(r.uploaded)+'<br>Subida por '+esc(r.by||'—'):'Todavía no hay ninguna versión publicada.'}</div></div>
  <div class="row"><button class="btn pri" id="apkbtn" onclick="$('apkfile').click()">${r?'Subir nueva versión':'Subir versión'}</button>${r?'<button class="btn bad" onclick="delApp()">Retirar</button>':''}</div>
  <input type="file" id="apkfile" accept=".apk" style="display:none" onchange="uploadApp(this.files[0])"></div>
  <div class="prog" id="appprog"><i></i></div><div class="err" id="apperr"></div></div>`;
  h+='<h2>Estado por pantalla</h2>';
  if(!scr.length)h+='<div class="card empty">No hay pantallas aprobadas.</div>';
  else h+=`<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Pantalla</th><th>Versión instalada</th><th>Última versión</th><th>Instalación automática</th></tr></thead><tbody>`+scr.map(s=>{
    const up=!r?['—','gray']:(s.upd_sha===r.sha256?['Al día','ok']:['Pendiente','warn']);
    const ow=s.owner===true?['Lista','ok']:(s.owner===false?['Falta activarla en este TV','bad']:['—','gray']);
    return `<tr><td><div class="t">${esc(s.name)}</div><div class="s">${s.online?'En línea':'Sin conexión'}</div></td>
    <td>${s.app?esc(s.app)+(s.app_code?' ('+s.app_code+')':''):'—'}</td><td><span class="badge ${up[1]}">${up[0]}</span></td><td><span class="badge ${ow[1]}">${ow[0]}</span></td></tr>`}).join('')+'</tbody></table></div>';
  h+=`<h2>Instalar la app en un televisor nuevo</h2><div class="card" style="font-size:13px;line-height:1.65">
  Reemplaza <code>192.168.0.XX</code> por la IP del televisor. Ábrelos en <b>PowerShell</b>, con el computador en la misma red WiFi que el TV.
  <p><b>1. En el TV</b> (con el control): Ajustes de Android → Información → pulsa <b>OK 7 veces</b> sobre «Compilación» → vuelve atrás → Opciones de desarrollador → activa <b>Depuración USB</b>. Anota la IP en Ajustes → Red (en los TV que ya tienen la app, la IP está en su tarjeta, en «IP en la red»).</p>
  <p><b>2. Si PowerShell dice que no reconoce «adb»</b> (hay que repetirlo en cada ventana nueva):</p>
  <pre class="cmd">$env:Path += ";$env:LOCALAPPDATA\\Android\\Sdk\\platform-tools"; adb version</pre>
  <p><b>3. Conectar</b> (la primera vez el TV pregunta «¿Permitir depuración USB?»: elige <b>Permitir siempre</b> con el control):</p>
  <pre class="cmd">adb connect 192.168.0.XX:5555</pre>
  <p><b>4. Comprobar la conexión.</b> Debe aparecer el TV con la palabra <code>device</code>. Si dice <code>unauthorized</code>, acepta el cuadro en el TV; si dice <code>offline</code>, apaga y enciende la Depuración USB del TV y vuelve a conectar.</p>
  <pre class="cmd">adb devices</pre>
  <p><b>5. Instalar.</b> Debe responder <code>Success</code>. Si tienes varios TV conectados a la vez, agrega <code>-s 192.168.0.XX:5555</code> justo después de <code>adb</code>:</p>
  <pre class="cmd">adb install -r C:\\android\\app\\build\\outputs\\apk\\debug\\app-debug.apk
adb -s 192.168.0.XX:5555 install -r C:\\android\\app\\build\\outputs\\apk\\debug\\app-debug.apk</pre>
  <p><b>6. Abrir la app</b> y luego aprobar la pantalla nueva en la pestaña «Pantallas» (nombre y orientación):</p>
  <pre class="cmd">adb -s 192.168.0.XX:5555 shell monkey -p com.tvplayer.signage -c android.intent.category.LAUNCHER 1</pre>
  <p><b>7. Opcional, actualizaciones sin confirmar en pantalla.</b> Solo funciona en algunos TV (por ejemplo Android 11). El TV no debe tener cuentas de Google (Ajustes → Cuentas). Si da error, no pasa nada: ese TV se actualizará igual, pero pidiendo confirmar con el control. En los TV Android 7.1 («RealtekATV») no funciona.</p>
  <pre class="cmd">adb -s 192.168.0.XX:5555 shell dpm set-device-owner com.tvplayer.signage/.AdminReceiver</pre>
  <p><b>8. Al terminar</b>, desconecta el TV:</p>
  <pre class="cmd">adb disconnect 192.168.0.XX:5555</pre>
  <div class="hint">Importante: todas las versiones de la app deben firmarse con la misma llave. Guarda una copia de <code>C:\\Users\\iscar\\.android\\debug.keystore</code>; si la pierdes, habría que desinstalar y reinstalar la app en cada TV.</div></div>`;
  $('v-app').innerHTML=h;
}
function uploadApp(file){
  if(!file)return;const p=$('appprog'),e=$('apperr');e.textContent='';p.style.display='block';$('apkbtn').disabled=true;APPUP=true;
  const x=new XMLHttpRequest();x.open('POST','/api/admin/app?name='+encodeURIComponent(file.name));x.setRequestHeader('X-Requested-With','panel');
  x.upload.onprogress=ev=>p.firstElementChild.style.width=(ev.loaded/ev.total*100)+'%';
  x.onload=()=>{APPUP=false;let j={};try{j=JSON.parse(x.responseText)}catch(_){}
    if(x.status===200){toast('Versión publicada');load()}else{e.textContent=j.error||('Error al subir ('+x.status+')');$('apkbtn').disabled=false;p.style.display='none'}};
  x.onerror=()=>{APPUP=false;e.textContent='Falló la conexión';$('apkbtn').disabled=false};
  x.send(file);
}
async function delApp(){if(!confirm('¿Retirar la versión publicada? Los televisores dejarán de recibirla (no se desinstala nada).'))return;await api('DELETE','/api/admin/app');load()}
/* ---- miniaturas: se generan en el navegador (fotograma del video / reducción de la imagen) ---- */
function makeThumb(src,kind){
  return new Promise(res=>{
    const url=(typeof src==='string')?null:URL.createObjectURL(src),u=url||src;
    const fin=b=>{if(url)URL.revokeObjectURL(url);res(b)};
    const draw=(el,w,h)=>{try{if(!w||!h)return fin(null);const m=360/Math.max(w,h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*m));c.height=Math.max(1,Math.round(h*m));c.getContext('2d').drawImage(el,0,0,c.width,c.height);c.toBlob(b=>fin(b),'image/jpeg',.78)}catch(e){fin(null)}};
    if(kind==='image'){const im=new Image();im.onload=()=>draw(im,im.naturalWidth,im.naturalHeight);im.onerror=()=>fin(null);im.src=u}
    else{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
      v.onloadeddata=()=>{v.currentTime=Math.min(1.5,(v.duration||2)*0.2)};
      v.onseeked=()=>draw(v,v.videoWidth,v.videoHeight);v.onerror=()=>fin(null);setTimeout(()=>fin(null),15000);v.src=u}
  });
}
async function postThumb(id,blob){await fetch('/api/admin/contents/'+id+'/thumb',{method:'POST',headers:{'X-Requested-With':'panel'},body:blob})}
const THUMBTRY=new Set();let BF=false;
async function backfill(){
  if(BF)return;BF=true;let any=false;
  try{for(const c of S.contents){
    if(c.type==='web'||c.thumb||THUMBTRY.has(c.id))continue;THUMBTRY.add(c.id);
    const b=await makeThumb('/api/admin/contents/'+c.id+'/file',c.type);
    if(b){await postThumb(c.id,b);any=true}
  }}catch(e){}finally{BF=false}
  if(any)load();
}
async function move(id,dir){await api('POST','/api/admin/contents/'+id+'/move',{dir});load()}
async function delContent(id){const c=S.contents.find(x=>x.id===id);if(!confirm('¿Eliminar "'+c.title+'"? Se borrará también de las pantallas.'))return;await api('DELETE','/api/admin/contents/'+id);load()}

const ORI_SHORT={0:'horizontal',90:'vertical 90°',270:'vertical 270°',180:'horizontal invertida'};
let PICKED=null,FBMODE=false;
function contentModal(id,file,mode){
  const c=id?S.contents.find(x=>x.id===id):null;PICKED=file||null;
  FBMODE=c?c.fallback:(mode==='fb');
  const type=c?c.type:(file?(/\.(jpe?g|png|webp|gif)$/i.test(file.name)?'image':'video'):'video');
  const appr=S.screens.filter(s=>s.status==='approved');
  const tgmode=(!c||!c.targets)?'all':(c.targets.some(x=>x.startsWith('ori:'))?'ori':'sel');
  const range=!!(c&&(c.start_at||c.end_at));
  openModal(`<h3>${FBMODE?(c?'Editar contenido de respaldo':'Subir contenido de respaldo'):(c?'Editar contenido':'Agregar contenido')}</h3>
  ${FBMODE?'<div class="note" style="margin-bottom:6px">Se muestra solo cuando la pantalla no tiene nada programado.</div>':''}
  <label>Tipo</label><select id="f-type" ${c?'disabled':''} onchange="typeChanged()"><option value="video">Video</option><option value="image">Imagen</option>${FBMODE?'':'<option value="web">Página web</option>'}</select>
  <div id="f-filebox"><label>Archivo</label>${c?`<div class="hint">${esc(c.orig_name||'')}. Para cambiar el archivo, elimina este contenido y crea uno nuevo.</div>`:`<input type="file" id="f-file" onchange="filePicked(this.files[0])"><div class="hint">Máximo ${S.max_upload_mb} MB. Videos: MP4 (H.264) 1080p. Imágenes: JPG/PNG. Verticales: 1080×1920.</div>`}</div>
  <div id="f-urlbox"><label>Dirección web</label><input type="url" id="f-url" value="${esc(c&&c.url||'')}" placeholder="https://www.lacole.edu.co/..."><label class="chk"><input type="checkbox" id="f-inter" ${c&&c.interactive?'checked':''}> Interactiva (el control remoto actúa sobre la página)</label></div>
  <label>Título</label><input type="text" id="f-title" value="${esc(c?c.title:(file?file.name.replace(/\.[^.]+$/,''):''))}">
  <div id="f-durbox"><label>Segundos en pantalla</label><input type="number" id="f-dur" min="3" max="3600" value="${c&&c.duration||(type==='web'?30:10)}"></div>
  <div id="f-schedbox" ${FBMODE?'style="display:none"':''}><label>Publicación</label>
  <label class="chk"><input type="radio" name="sch" value="always" ${range?'':'checked'} onchange="schChanged()"> Indefinida: se muestra siempre, hasta que lo elimines</label>
  <label class="chk"><input type="radio" name="sch" value="range" ${range?'checked':''} onchange="schChanged()"> Programar fechas</label>
  <div id="f-datebox" class="two"><div><label>Empieza</label><input type="datetime-local" id="f-start" value="${toLocalInput(c&&c.start_at)}"></div><div><label>Termina</label><input type="datetime-local" id="f-end" value="${toLocalInput(c&&c.end_at)}"></div></div>
  <div id="f-datehint" class="hint">Deja «Empieza» vacío para publicar de inmediato, o «Termina» vacío si no tiene fecha de fin.</div></div>
  <label>Pantallas</label>
  <label class="chk"><input type="radio" name="tg" value="all" ${tgmode==='all'?'checked':''} onchange="tgChanged()"> Todas las pantallas (incluye las que se agreguen después)</label>
  <label class="chk"><input type="radio" name="tg" value="ori" ${tgmode==='ori'?'checked':''} onchange="tgChanged()"> Por orientación (incluye las que se agreguen después)</label>
  <div id="f-tgo" style="padding-left:24px">${[[0,'Todas las horizontales'],[270,'Todas las verticales 270° (girada a la izquierda)'],[90,'Todas las verticales 90° (girada a la derecha)'],[180,'Todas las horizontales invertidas (180°)']].map(([o,l])=>`<label class="chk"><input type="checkbox" class="tgo" value="ori:${o}" ${c&&c.targets&&c.targets.includes('ori:'+o)?'checked':''}> ${l} <span class="badge gray">${appr.filter(s=>s.orientation===o).length}</span></label>`).join('')}</div>
  <label class="chk"><input type="radio" name="tg" value="sel" ${tgmode==='sel'?'checked':''} onchange="tgChanged()"> Solo algunas pantallas</label>
  <div id="f-tgs" style="padding-left:24px">${appr.map(s=>`<label class="chk"><input type="checkbox" class="tgc" value="${s.id}" ${c&&c.targets&&c.targets.includes(s.id)?'checked':''}> ${esc(s.name)} <span class="badge gray">${ORI_SHORT[s.orientation]||'horizontal'}</span></label>`).join('')||'<div class="hint">No hay pantallas aprobadas.</div>'}</div>
  <div class="prog" id="prog"><i></i></div><div class="err" id="err"></div>
  <div class="row" style="margin-top:18px"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="savebtn" onclick="saveContent(${c?`'${c.id}'`:'null'})">${c?'Guardar':(FBMODE?'Subir':'Subir y publicar')}</button></div>`);
  $('f-type').value=type;typeChanged();schChanged();tgChanged();
}
function typeChanged(){
  const t=$('f-type').value,edit=$('f-type').disabled;
  $('f-filebox').style.display=t==='web'?'none':'';$('f-urlbox').style.display=t==='web'?'':'none';
  $('f-durbox').style.display=t==='video'?'none':'';
  if(!edit&&$('f-file')){$('f-file').accept=t==='image'?'image/*':'video/*'}
}
function schChanged(){
  const r=document.querySelector('input[name=sch]:checked').value==='range';
  $('f-datebox').style.display=r?'':'none';$('f-datehint').style.display=r?'':'none';
}
function tgChanged(){const v=document.querySelector('input[name=tg]:checked').value;$('f-tgs').style.display=v==='sel'?'':'none';$('f-tgo').style.display=v==='ori'?'':'none'}
function filePicked(f){PICKED=f;if(f&&!$('f-title').value)$('f-title').value=f.name.replace(/\.[^.]+$/,'');if(f)$('f-type').value=/\.(jpe?g|png|webp|gif)$/i.test(f.name)?'image':'video';typeChanged()}
function upload(file,onp){return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();x.open('POST','/api/admin/upload?name='+encodeURIComponent(file.name));x.setRequestHeader('X-Requested-With','panel');
  x.upload.onprogress=e=>onp(e.loaded/e.total);x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status===200?res(j):rej(new Error(j.error||'Error al subir ('+x.status+')'))};
  x.onerror=()=>rej(new Error('Falló la conexión'));x.send(file)})}
async function saveContent(id){
  const btn=$('savebtn');$('err').textContent='';
  const type=$('f-type').value,fb=FBMODE,always=fb||document.querySelector('input[name=sch]:checked').value==='always';
  const body={type,title:$('f-title').value,fallback:fb,duration:+$('f-dur').value||null,interactive:$('f-inter')&&$('f-inter').checked,
    url:$('f-url').value,start_at:always?null:fromLocalInput($('f-start').value),end_at:always?null:fromLocalInput($('f-end').value),
    targets:null};
  const tgm=document.querySelector('input[name=tg]:checked').value;
  if(tgm!=='all')body.targets=[...document.querySelectorAll(tgm==='ori'?'.tgo:checked':'.tgc:checked')].map(x=>x.value);
  if(body.targets&&!body.targets.length){$('err').textContent=tgm==='ori'?'Elige al menos una orientación':'Elige al menos una pantalla';return}
  btn.disabled=true;
  try{
    if(id){await api('PATCH','/api/admin/contents/'+id,body)}
    else{
      if(type!=='web'){
        if(!PICKED)throw new Error('Elige un archivo');
        const p=$('prog');p.style.display='block';
        const u=await upload(PICKED,f=>p.firstElementChild.style.width=(f*100)+'%');
        body.file=u.file;body.orig_name=u.orig_name;
      }
      const made=await api('POST','/api/admin/contents',body);
      if(type!=='web'&&PICKED){try{const tb=await makeThumb(PICKED,type);if(tb)await postThumb(made.id,tb)}catch(e){}}
    }
    closeModal();toast('Guardado');load();
  }catch(e){$('err').textContent=e.message;btn.disabled=false}
}

/* ---------------- Modal / render ---------------- */
function openModal(h){$('modal').innerHTML=h;$('mbg').classList.add('show')}
function closeModal(){$('mbg').classList.remove('show');render()}
function render(){if(TAB==='screens')renderScreens();else if(TAB==='contents')renderContents();else if(TAB==='app')renderApp();else renderFallback()}
load();setInterval(load,5000);
</script>
</body>
