<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantallas La Cole</title>
<link rel="icon" href="/static/icon.png"><link rel="stylesheet" href="/static/fonts.css">
<style>
:root{--p:#800cab;--p2:#5e0880;--pl:#f6eefb;--bg:#f5f4f7;--card:#fff;--tx:#23202a;--mut:#6d6877;--bd:#e4e0ea;--ok:#1f9d55;--warn:#d98a00;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;letter-spacing:-.003em}
button,input,select{font-family:inherit}
header{background:var(--p);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;position:sticky;top:0;z-index:5}
header img{height:34px;display:block}header .me{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header h1{min-width:0}
header .sep{width:1px;height:26px;background:#fff6}
header h1{font-size:16px;margin:0;font-weight:700;flex:1;letter-spacing:-.01em}
header .me{font-size:12px;opacity:.9}
header a{color:#fff;font-size:12px;opacity:.85}
nav{display:flex;gap:4px;padding:14px 22px 0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;padding:10px 18px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p)}
main{padding:16px 22px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--tx)}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p2);color:#fff}
.btn.bad{color:var(--bad)}.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
h2{font-size:16px;margin:18px 0 10px;font-weight:800;letter-spacing:-.01em}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px #1f9d5530}
.scr h3{min-width:0;margin:0;font-size:16px;font-weight:800}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;margin:12px 0;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.now{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1.5px solid var(--bd);background:#faf9fb;font-size:13px;margin-top:12px}
.now.live{border-color:var(--ok);background:#f0faf4}
.now .lamp{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.now.live .lamp{background:var(--ok);box-shadow:0 0 0 3px #1f9d5533}
.now .lbl{color:var(--mut);flex:none}.now .ttl{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code.cp{cursor:pointer;background:#f3f1f6;padding:1px 6px;border-radius:6px}
code.cp:hover{outline:1px solid var(--p)}
pre.cmd{background:#f3f1f6;padding:10px 12px;border-radius:8px;margin:6px 0 10px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.badge{white-space:nowrap;display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--pl);color:var(--p)}
.badge.ok{background:#e3f6ea;color:var(--ok)}.badge.warn{background:#fff3d6;color:var(--warn)}
.badge.bad{background:#fde7e7;color:var(--bad)}.badge.gray{background:#eee;color:#666}
.pending{border:2px dashed var(--p);background:var(--pl)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600}
td .t{font-weight:700}td .s{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut);margin-bottom:14px;background:#fff}
.drop.over{border-color:var(--p);background:var(--pl)}
.modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);padding:22px}
.modal h3{margin:0 0 14px;font-size:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=url],input[type=number],input[type=datetime-local],input[type=time],select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--p);border-color:var(--p)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--tx);margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.sched{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.sched label.d{display:inline-flex;align-items:center;gap:3px;margin:0;font-weight:500;color:var(--tx);font-size:12px}
.prog{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:8px;display:none}
.prog i{display:block;height:100%;background:var(--p);width:0}
.err{color:var(--bad);font-size:13px;margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;z-index:50;display:none}
.arrows button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 4px;font-size:12px}
.arrows button:hover{color:var(--p)}
.th{width:128px;height:72px;border-radius:10px;background:#16121b;object-fit:contain;display:block;flex:none;border:1px solid var(--bd)}
.th.ph{display:grid;place-items:center;color:#9d93ab}
.th.ph svg{width:28px;height:28px}
.fbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.fbcard{display:flex;gap:14px;align-items:flex-start}
.fbcard .th{width:160px;height:90px}
.fbcard h3{margin:0 0 4px;font-size:15px;font-weight:800}
.note{background:var(--pl);border-radius:10px;padding:12px 14px;color:#4b3a58;font-size:13px;margin-bottom:14px;line-height:1.5}
.cell{display:flex;align-items:center;gap:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.ccard{padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ctop{display:flex;gap:10px;min-width:0}
.cthumb{position:relative;flex:none;width:104px}
.cthumb .th{width:104px;height:auto;aspect-ratio:16/9;border-radius:8px}
.cthumb .th.ph svg{width:24px;height:24px}
.cbody{flex:1;min-width:0}
.ct{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{font-size:11.5px;color:var(--mut);margin:1px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbadges{display:flex;gap:4px;flex-wrap:wrap}
.cbadges .badge{font-size:10.5px;padding:1px 7px}
.ci{display:flex;gap:6px;font-size:11.5px;line-height:1.5;min-width:0}
.ci span{color:var(--mut);flex:none}
.ci b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cact{display:flex;align-items:center;gap:6px}
@media(max-width:700px){header{gap:8px;padding:8px 12px}header .sep,header h1{display:none}nav{padding:10px 8px 0}nav button{padding:10px 12px}main{padding:14px 12px 50px}th:nth-child(4),td:nth-child(4){display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--tx)}
.chip:hover{border-color:var(--p);color:var(--p)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip i{font-style:normal;opacity:.7;font-weight:600;margin-left:4px}
.ccard[draggable=true]{cursor:grab}
.ccard.dragging{opacity:.35}
.ccard.dropbefore{box-shadow:-4px 0 0 var(--p)}
.ccard.dropafter{box-shadow:4px 0 0 var(--p)}
.grip{color:var(--mut);font-size:15px;letter-spacing:-2px;user-select:none;cursor:grab}
.warn{background:#fff3d6;color:#7a4d00;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:8px;line-height:1.45}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pl .th{width:72px;height:41px;border-radius:6px}
.pl .t{font-weight:700;font-size:13px}.pl .s{font-size:12px;color:var(--mut)}
.pl .n{width:22px;color:var(--mut);font-size:12px;text-align:right;flex:none}
.modal.wide{width:min(680px,100%)}
.help h2{margin-top:26px}.help ol{padding-left:20px;line-height:1.7}.help li{margin-bottom:4px}
.help table{font-size:13px}.help td,.help th{vertical-align:top}
.tree{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;max-height:340px;overflow:auto;background:var(--card)}
.tgrp{padding:4px 0;border-bottom:1px solid var(--bd)}.tgrp:last-of-type{border-bottom:0}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tcar{border:0;background:none;cursor:pointer;font-size:14px;width:22px;padding:0;color:var(--mut)}
.tkids{padding:2px 0 6px 30px}.tchild{margin:3px 0}
.gmem{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 14px}
details.gcard>summary{list-style:none}details.gcard>summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<header>
  <img src="/static/logo_white.png" alt="Colegiatura Antioqueña de Belleza">
  <span class="sep"></span>
  <h1>Panel de pantallas</h1>
  <span class="me" id="me"></span>
  <a href="/logout">Salir</a>
</header>
<div id="stale" style="display:none;background:#fff3d6;color:#7a5200;padding:10px 20px;font-size:14px;font-weight:600">Hay una versión nueva del panel. <a href="#" onclick="hardReload();return false" style="color:#7a5200">Recargar ahora</a></div>
<nav>
  <button id="t-screens" class="on" onclick="tab('screens')">Pantallas</button>
  <button id="t-contents" onclick="tab('contents')">Contenido</button>
  <button id="t-fallback" onclick="tab('fallback')">Respaldo</button>
  <button id="t-groups" onclick="tab('groups')" style="display:none">Grupos</button>
  <button id="t-app" onclick="tab('app')">Aplicación</button>
  <button id="t-admins" onclick="tab('admins')" style="display:none">Administradores</button>
  <button id="t-help" onclick="tab('help')">Ayuda</button>
</nav>
<main>
  <section id="v-screens"></section>
  <section id="v-contents" style="display:none"></section>
  <section id="v-fallback" style="display:none"></section>
  <section id="v-groups" style="display:none"></section>
  <section id="v-app" style="display:none"></section>
  <section id="v-admins" style="display:none"></section>
  <section id="v-help" class="help" style="display:none"></section>
</main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
let S={screens:[],contents:[],now:0};
const PAGE_VERSION='2.4.1';
let TAB='screens';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORI={0:'Horizontal',90:'Vertical (girada a la derecha)',270:'Vertical (girada a la izquierda)',180:'Horizontal invertida'};
const DAYS=['L','M','X','J','V','S','D'];

async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'X-Requested-With':'panel','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location='/login';throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('Error '+r.status));
  return j;
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function tab(t){TAB=t;for(const x of['screens','contents','fallback','groups','app','admins','help']){$('v-'+x).style.display=x===t?'':'none';$('t-'+x).classList.toggle('on',x===t)}render()}
function fmt(ts){return ts?new Date(ts*1000).toLocaleString('es-CO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function ago(ts){if(!ts)return 'nunca';const d=Date.now()/1000-ts;if(d<60)return 'hace unos segundos';if(d<3600)return 'hace '+Math.round(d/60)+' min';if(d<86400)return 'hace '+Math.round(d/3600)+' h';return 'hace '+Math.round(d/86400)+' d'}
function toLocalInput(ts){if(!ts)return '';const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function fromLocalInput(v){return v?Math.floor(new Date(v).getTime()/1000):null}

async function load(){
  try{S=await api('GET','/api/admin/state');$('me').textContent=S.me+(S.is_super?'':' · acceso limitado');
    $('stale').style.display=(S.version&&S.version!==PAGE_VERSION)?'':'none';$('t-app').style.display=S.is_super?'':'none';$('t-groups').style.display=S.is_super?'':'none';$('t-admins').style.display=S.is_super?'':'none';
    if(!S.is_super&&(TAB==='app'||TAB==='admins'||TAB==='groups'))tab('screens');
    if(!$('mbg').classList.contains('show'))if(!(TAB==='app'&&APPUP))render();backfill()}catch(e){}
}

function confirmBox(title,msg,okLabel,fn){
  window._cfn=fn;
  openModal(`<h3>${esc(title)}</h3><div style="font-size:14px;line-height:1.5">${msg}</div>
  <div class="row" style="margin-top:20px"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" style="background:var(--bad);border-color:var(--bad)" onclick="const f=window._cfn;closeModal();f()">${esc(okLabel)}</button></div>`);
}
let GF='';try{GF=localStorage.getItem('gf')||''}catch(e){}
function setGF(g){GF=g;try{localStorage.setItem('gf',g)}catch(e){}renderScreens()}
function gName(id){const g=(S.groups||[]).find(x=>x.id===id);return g?g.name:''}
function gIdx(id){const i=(S.groups||[]).findIndex(x=>x.id===id);return i<0?99:i}
function sGroups(s){return (s.groups||[]).filter(id=>gName(id)).sort((a,b)=>gIdx(a)-gIdx(b)).map(gName)}
function sRank(s){return Math.min(99,...(s.groups||[]).map(gIdx))}
function tHit(c,s){return !c.targets||c.targets.includes(s.id)||c.targets.includes('ori:'+s.orientation)||(s.groups||[]).some(g=>c.targets.includes('grp:'+g))}
function matchScreens(c){return S.screens.filter(s=>s.status==='approved'&&tHit(c,s))}
function playlistOf(s){return S.contents.filter(c=>!c.fallback&&tHit(c,s))}
function byName(a,b){return a.name.localeCompare(b.name,'es',{numeric:true})}
/* ---------------- Pantallas ---------------- */
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado: '+t),()=>toast(t))}catch(e){toast(t)}}
function renderScreens(){
  const pend=S.screens.filter(s=>s.status==='pending'),all=S.screens.filter(s=>s.status==='approved');
  let h='';
  if(pend.length){
    h+='<h2>Pantallas nuevas por aprobar</h2><div class="grid">'+pend.map(s=>`
      <div class="card pending scr"><div class="row"><span class="dot ${s.online?'on':''}"></span><h3>${esc(s.name)}</h3></div>
      <div class="kv"><span>Código</span><span>${esc(s.id.slice(0,8))}</span><span>Equipo</span><span>${esc(s.model||'—')} ${s.android?'· Android '+esc(s.android):''}</span><span>Red</span><span>${esc(s.ip||'—')}</span><span>Visto</span><span>${ago(s.last_seen)}</span></div>
      <div class="row"><button class="btn pri" onclick="approveModal('${s.id}')">Aprobar</button><button class="btn bad" onclick="delScreen('${s.id}')">Rechazar</button></div></div>`).join('')+'</div>';
  }
  if(!S.is_super){const gl=(S.scope&&S.scope.groups||[]).map(gName).filter(Boolean),n=(S.scope&&S.scope.screens||[]).length;
    h+=`<div class="note"><b>Acceso limitado.</b> Puedes subir y gestionar contenido en tus pantallas${gl.length?' (grupos: '+gl.map(esc).join(', ')+')':''}${n?(gl.length?' y ':' ')+n+' pantalla'+(n>1?'s':'')+' asignada'+(n>1?'s':''):''}. Para cambios en las pantallas, la app o los administradores, escribe a comunicaciones@lacole.edu.co.</div>`}
  const groups=(S.groups||[]).slice();
  const inAny=s=>(s.groups||[]).some(id=>gName(id));
  const noGrp=all.filter(s=>!inAny(s));
  if(GF&&GF!=='__none'&&!groups.some(g=>g.id===GF))GF='';
  const chip=(g,label,n,on)=>`<button class="chip ${on?'on':''}" onclick="setGF('${g}')">${esc(label)}<i>${n}</i></button>`;
  const ok=GF===''?all:(GF==='__none'?noGrp:all.filter(s=>(s.groups||[]).includes(GF)));
  ok.sort((a,b)=>(GF===''?sRank(a)-sRank(b):0)||byName(a,b));
  const on=all.filter(s=>s.online).length;
  h+='<h2>Pantallas <span style="font-weight:600;color:var(--mut);font-size:13px">· '+on+' en línea de '+all.length+(S.open_now?'':' · fuera de horario de funcionamiento')+'</span></h2>';
  h+='<div class="chips">'+chip('','Todas',all.length,GF==='')+groups.map(g=>chip(g.id,g.name,all.filter(s=>(s.groups||[]).includes(g.id)).length,GF===g.id)).join('')+(noGrp.length?chip('__none','Sin grupo',noGrp.length,GF==='__none'):'')+'</div>';
  if(!all.length)h+='<div class="card empty">'+(S.is_super?'Aún no hay pantallas aprobadas.<br>Instala la app en un TV; aparecerá arriba para que la apruebes. Los pasos están en la pestaña Ayuda.':'Todavía no tienes pantallas asignadas. Pídele a comunicaciones@lacole.edu.co que te asigne las que necesitas.')+'</div>';
  else if(!ok.length)h+='<div class="card empty">No hay pantallas en este grupo todavía.</div>';
  else h+='<div class="grid">'+ok.map(s=>{
    const badge=s.online?['ok','En línea']:(S.open_now?['bad','Sin conexión']:['gray','Fuera de horario']);
    const rows=[['Orientación',s.orientation===0?'Horizontal':ORI[s.orientation]||'Vertical'],
      s.lan_ip?['IP en la red',`<code class="cp" title="Clic para copiar el comando de conexión" onclick="copyText('adb connect ${esc(s.lan_ip)}:5555')">${esc(s.lan_ip)}</code>`]:null,
      s.state?['Estado',esc(s.state)]:null,
      s.free_mb!=null?['Espacio libre',s.free_mb>=1024?(s.free_mb/1024).toFixed(1)+' GB':s.free_mb+' MB']:null,
      ['Equipo',esc(s.model||'—')+(s.android?' · Android '+esc(s.android):'')+(s.app?' · app '+esc(s.app):'')],
      ['Visto',ago(s.last_seen)+(s.ip?' · '+esc(s.ip):'')],
      s.last_sync?['Sincronizó',ago(s.last_sync)]:null].filter(Boolean);
    return `<div class="card scr"><div class="row"><span class="dot ${s.online?'on':''}"></span><h3>${esc(s.name)}</h3><span class="sp"></span><span class="badge ${badge[0]}">${badge[1]}</span></div>
    ${GF===''&&sGroups(s).length?`<div class="s" style="font-size:12px;color:var(--mut);margin:2px 0 0 18px">${esc(sGroups(s).join(' · '))}</div>`:''}
    ${s.online?`<div class="now ${s.now_title?'live':''}"><span class="lamp"></span><span class="lbl">Reproduce</span><span class="ttl">${esc(s.now_title||'—')}</span></div>`:''}
    <div class="kv">${rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('')}</div>
    <div class="row" style="flex-wrap:wrap">${S.is_super?`<button class="btn sm bad" onclick="delScreen('${s.id}')">Quitar</button>
    <button class="btn sm" onclick="cmd('${s.id}','reload')">Reiniciar</button>`:''}
    <button class="btn sm" onclick="playlistModal('${s.id}')">Lista de reproducción</button>
    <span class="sp"></span>${S.is_super?`<button class="btn sm" onclick="editScreen('${s.id}')">Editar</button> `:''}<button class="btn pri" onclick="contentModal(null,null,null,'${s.id}')">+ Contenido</button></div></div>`}).join('')+'</div>';
  $('v-screens').innerHTML=h;
}
function playlistModal(id){
  const s=S.screens.find(x=>x.id===id),n=S.now;

    return `<div class="pl"><span class="n">${i?i:''}</span>${thumbHtml(c)}<div style="flex:1;min-width:0"><div class="t">${esc(c.title)}</div><div class="s">${TYPES[c.type]}${c.type==='image'&&c.duration?' · '+c.duration+' s':''} · ${esc(sched)}</div></div><span class="badge ${st[1]}">${st[0]}</span></div>`};

/* ---------------- Contenido ---------------- */
function statusOf(c){
  if(c.fallback)return['Respaldo','gray'];
  const n=S.now;
  if(c.end_at&&c.end_at<n)return['Vencido','bad'];
  if(c.start_at&&c.start_at>n)return['Programado','warn'];
  return['Activo','ok'];
}
const TYPES={video:'Video',image:'Imagen',web:'Página web'};
const OGRP={0:'Horizontales',90:'Verticales 90°',270:'Verticales 270°',180:'Horizontales invertidas'};
function targetText(c){
  if(!c.targets)return 'Todas las pantallas';
  const parts=c.targets.map(id=>id.startsWith('ori:')?'Todas las '+OGRP[+id.slice(4)].toLowerCase():id.startsWith('grp:')?gName(id.slice(4)):(S.screens.find(s=>s.id===id)||{}).name).filter(Boolean);
  return parts.length?parts.join(', '):'Ninguna pantalla'}
function targetShort(c){
  if(!c.targets)return 'Todas';
  const n=matchScreens(c);
  if(!n.length)return 'Ninguna pantalla';
  const onlyGroups=c.targets.every(t=>t.startsWith('grp:')||t.startsWith('ori:'));
  if(onlyGroups)return c.targets.map(t=>t.startsWith('grp:')?gName(t.slice(4)):OGRP[+t.slice(4)]).filter(Boolean).join(', ');
  return n.length===1?n[0].name:n.length+' pantallas'}
const ICON={video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
 image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>',
 web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>'};
function thumbHtml(c){
  if(c.thumb)return `<img class="th" alt="" src="/api/admin/contents/${c.id}/thumb?v=${c.thumb}">`;
  return `<div class="th ph">${ICON[c.type]||''}</div>`;
}
function renderContents(){
  const list=S.contents.filter(c=>!c.fallback),eds=list.filter(c=>c.editable);
  let h=`<div class="drop" id="drop">Arrastra aquí videos o imágenes, o <button class="btn pri sm" onclick="contentModal()">+ Agregar contenido</button></div>`;
  if(list.length)h+='<div class="hint" style="margin:-4px 0 10px">Para cambiar el orden, arrastra una tarjeta a su nuevo lugar (o usa las flechas).</div>';
  if(!list.length)h+='<div class="card empty">No hay contenido todavía.</div>';
  else h+='<div class="cgrid" id="cgrid">'+list.map((c,i)=>{
    const st=statusOf(c);
    const sched=(c.start_at||c.end_at)?(c.start_at?fmt(c.start_at):'Ya')+' → '+(c.end_at?fmt(c.end_at):'sin fin'):'Indefinida';
    const meta=c.type==='web'?(c.url||''):(c.type==='image'?c.duration+' s':'')+(c.size?(c.type==='image'?' · ':'')+(c.size/1048576).toFixed(1)+' MB':'');
    return `<div class="card ccard" draggable="${c.editable}" data-ed="${c.editable?1:0}" data-id="${c.id}"><div class="ctop"><div class="cthumb">${thumbHtml(c)}</div>
    <div class="cbody"><div class="ct" title="${esc(c.title)}">${esc(c.title)}</div>
    <div class="cm">${meta?esc(meta)+(c.interactive?' · interactiva':''):(c.interactive?'Interactiva':'&nbsp;')}</div>
    <div class="cbadges"><span class="badge">${TYPES[c.type]}</span><span class="badge ${st[1]}">${st[0]}</span></div></div></div>
    <div><div class="ci"><span>Publicación</span><b title="${esc(sched)}">${esc(sched)}</b></div>
    <div class="ci"><span>Pantallas</span><b title="${esc(targetText(c))}">${esc(targetShort(c))}</b></div></div>
    <div class="cact">${c.editable?`<span class="grip" title="Arrastra para reordenar">⋮⋮</span><span class="arrows"><button title="Mover antes" onclick="move('${c.id}','up')" ${eds.indexOf(c)>0?'':'disabled'}>◀</button><button title="Mover después" onclick="move('${c.id}','down')" ${eds.indexOf(c)<eds.length-1?'':'disabled'}>▶</button></span><span class="sp"></span><button class="btn sm" onclick="contentModal('${c.id}')">Editar</button><button class="btn sm bad" onclick="delContent('${c.id}')">Eliminar</button>`:'<span class="hint" style="margin:0">Publicado por comunicaciones · solo lectura</span>'}</div></div>`}).join('')+'</div>';
  $('v-contents').innerHTML=h;
  const d=$('drop');
  d.ondragover=e=>{if(!DRAG){e.preventDefault();d.classList.add('over')}};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{if(DRAG)return;e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files[0])contentModal(null,e.dataTransfer.files[0])};
  const g=$('cgrid');if(g)wireDnD(g);
}
let DRAG=null;
function wireDnD(g){
  const clear=()=>g.querySelectorAll('.dropbefore,.dropafter,.dragging').forEach(x=>x.classList.remove('dropbefore','dropafter','dragging'));
  g.querySelectorAll('.ccard[data-ed="1"]').forEach(card=>{
    card.ondragstart=e=>{DRAG=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',DRAG)}catch(_){}};
    card.ondragend=()=>{DRAG=null;clear()};
    card.ondragover=e=>{if(!DRAG||card.dataset.id===DRAG)return;e.preventDefault();const r=card.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;
      g.querySelectorAll('.dropbefore,.dropafter').forEach(x=>x.classList.remove('dropbefore','dropafter'));card.classList.add(after?'dropafter':'dropbefore')};
    card.ondrop=async e=>{e.preventDefault();if(!DRAG)return;const id=DRAG,after=card.classList.contains('dropafter');clear();DRAG=null;
      if(id===card.dataset.id)return;
      const ids=[...g.querySelectorAll('.ccard[data-ed="1"]')].map(x=>x.dataset.id).filter(x=>x!==id);
      let i=ids.indexOf(card.dataset.id);if(after)i++;ids.splice(i,0,id);
      try{await api('POST','/api/admin/contents/order',{ids});await load()}catch(err){toast(err.message)}};
  });
}
function renderFallback(){
  const list=S.contents.filter(c=>c.fallback);
  let h=`<div class="note"><b>¿Qué es el contenido de respaldo?</b><br>Es lo que una pantalla muestra cuando no tiene nada programado para ese momento, para que nunca se quede en negro. Puedes subir uno para todas las pantallas o uno distinto para algunas.</div>
  <div class="row" style="margin-bottom:14px"><button class="btn pri" onclick="contentModal(null,null,'fb')">+ Subir contenido de respaldo</button></div>`;
  if(!list.length)h+='<div class="card empty">Aún no hay contenido de respaldo.</div>';
  else h+='<div class="fbgrid">'+list.map(c=>`<div class="card fbcard">${thumbHtml(c)}<div style="flex:1;min-width:0">
    <h3>${esc(c.title)}</h3><div class="s" style="font-size:12px;color:var(--mut);margin-bottom:10px"><span class="badge">${TYPES[c.type]}</span> ${esc(targetText(c))}${c.size?' · '+(c.size/1048576).toFixed(1)+' MB':''}</div>
    ${c.editable?`<div class="row"><button class="btn sm" onclick="contentModal('${c.id}')">Editar</button><button class="btn sm bad" onclick="delContent('${c.id}')">Eliminar</button></div>`:'<div class="hint" style="margin:0">Solo lectura</div>'}</div></div>`).join('')+'</div>';
  $('v-fallback').innerHTML=h;
}

let APPUP=false;
function bytes(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}
function renderApp(){
  const r=S.release,scr=S.screens.filter(s=>s.status==='approved');
  let h=`<div class="note"><b>Actualización automática de la app de los televisores</b><br>Sube aquí la nueva versión (el archivo <code>app-debug.apk</code> que compila Android Studio). Los televisores que ya tienen activada la instalación automática la descargan e instalan solos en pocos minutos, sin que tengas que visitarlos. La versión debe tener un <b>versionCode</b> mayor que la instalada.</div>
  <div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:14px">
  <div style="flex:1;min-width:240px"><div style="font-weight:800;font-size:15px">Versión publicada</div>
  <div class="s" style="font-size:13px;color:var(--mut);margin-top:4px">${r?esc(r.orig_name)+' · '+bytes(r.size)+' · '+fmt(r.uploaded)+'<br>Subida por '+esc(r.by||'—'):'Todavía no hay ninguna versión publicada.'}</div></div>
  <div class="row"><button class="btn pri" id="apkbtn" onclick="$('apkfile').click()">${r?'Subir nueva versión':'Subir versión'}</button>${r?'<button class="btn bad" onclick="delApp()">Retirar</button>':''}</div>
  <input type="file" id="apkfile" accept=".apk" style="display:none" onchange="uploadApp(this.files[0])"></div>
  <div class="prog" id="appprog"><i></i></div><div class="err" id="apperr"></div></div>`;
  h+='<h2>Estado por pantalla</h2>';
  if(!scr.length)h+='<div class="card empty">No hay pantallas aprobadas.</div>';
  else h+=`<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Pantalla</th><th>Versión instalada</th><th>Última versión</th><th>Instalación automática</th></tr></thead><tbody>`+scr.map(s=>{
    const up=!r?['—','gray']:(s.upd_sha===r.sha256?['Al día','ok']:['Pendiente','warn']);
    const ow=s.owner===true?['Lista','ok']:(s.owner===false?['Falta activarla en este TV','bad']:['—','gray']);
    return `<tr><td><div class="t">${esc(s.name)}</div><div class="s">${s.online?'En línea':'Sin conexión'}</div></td>
    <td>${s.app?esc(s.app)+(s.app_code?' ('+s.app_code+')':''):'—'}</td><td><span class="badge ${up[1]}">${up[0]}</span></td><td><span class="badge ${ow[1]}">${ow[0]}</span></td></tr>`}).join('')+'</tbody></table></div>';
  h+=`<h2>Alertas por correo</h2><div class="card"><div class="row" style="flex-wrap:wrap;gap:14px"><div style="flex:1;min-width:240px;font-size:13px;color:var(--mut)">Recibe un correo cuando una pantalla lleve varios minutos sin conexión (30 por defecto, se configura) dentro del horario de funcionamiento, y otro cuando vuelva.</div><button class="btn pri" onclick="alertsModal()">Configurar alertas</button></div></div>`;
  h+=`<div class="note" style="margin-top:16px">¿Vas a instalar la app en un televisor nuevo? Los pasos están en la pestaña <b>Ayuda</b>.</div>`;
  $('v-app').innerHTML=h;
}

}
async function alertsSave(quiet){
  try{await api('POST','/api/admin/alerts',{on:$('al_on').checked,url:$('al_url').value,secret:$('al_secret').value,to:$('al_to').value,minutes:$('al_min').value});
    if(!quiet){closeModal();toast('Alertas guardadas')}return true}
  catch(e){$('al_err').textContent=e.message;return false}
}
async function alertsTest(){
  $('al_err').textContent='';if(!await alertsSave(true))return;
  $('al_err').style.color='var(--mut)';$('al_err').textContent='Enviando…';
  try{await api('POST','/api/admin/alerts/test');$('al_err').style.color='var(--ok)';$('al_err').textContent='Listo: revisa la bandeja de entrada.'}
  catch(e){$('al_err').style.color='';$('al_err').textContent=e.message}
}

let ADMINS=null,ADMINS_LOADING=false;
async function loadAdmins(){if(ADMINS_LOADING)return;ADMINS_LOADING=true;try{ADMINS=await api('GET','/api/admin/admins')}catch(e){toast(e.message)}ADMINS_LOADING=false;renderAdmins()}

function verCard(){
  const stale=S.version&&S.version!==PAGE_VERSION;
  return `<div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:14px"><div style="flex:1;min-width:240px">
  <div style="font-weight:800;font-size:15px">Versión del panel</div>
  <div class="kv" style="margin-top:8px"><span>En el servidor</span><span><b>${esc(S.version||'—')}</b> · ${esc(S.build||'')}</span>

function uploadApp(file){

  x.upload.onprogress=ev=>p.firstElementChild.style.width=(ev.loaded/ev.total*100)+'%';
  x.onload=()=>{APPUP=false;let j={};try{j=JSON.parse(x.responseText)}catch(_){}

  x.onerror=()=>{APPUP=false;e.textContent='Falló la conexión';$('apkbtn').disabled=false};

function makeThumb(src,kind){
  return new Promise(res=>{
    const url=(typeof src==='string')?null:URL.createObjectURL(src),u=url||src;
    const fin=b=>{if(url)URL.revokeObjectURL(url);res(b)};
    const draw=(el,w,h)=>{try{if(!w||!h)return fin(null);const m=360/Math.max(w,h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*m));c.height=Math.max(1,Math.round(h*m));c.getContext('2d').drawImage(el,0,0,c.width,c.height);c.toBlob(b=>fin(b),'image/jpeg',.78)}catch(e){fin(null)}};
    if(kind==='image'){const im=new Image();im.onload=()=>draw(im,im.naturalWidth,im.naturalHeight);im.onerror=()=>fin(null);im.src=u}
    else{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
      v.onloadeddata=()=>{v.currentTime=Math.min(1.5,(v.duration||2)*0.2)};
      v.onseeked=()=>draw(v,v.videoWidth,v.videoHeight);v.onerror=()=>fin(null);setTimeout(()=>fin(null),15000);v.src=u}
  });
}

  const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';
  v.onloadedmetadata=()=>{URL.revokeObjectURL(u);const W=v.videoWidth,H=v.videoHeight,long=Math.max(W,H),short=Math.min(W,H);

}

    url:$('f-url').value,start_at:always?null:fromLocalInput($('f-start').value),end_at:always?null:fromLocalInput($('f-end').value),
    targets:null};
  const tgm=document.querySelector('input[name=tg]:checked').value;
  if(tgm!=='all')body.targets=[...[...SEL.g].map(g=>'grp:'+g),...SEL.s,...SEL.o];
  if(body.targets&&!body.targets.length){$('err').textContent='Elige al menos un grupo o una pantalla';return}
  btn.disabled=true;
  try{
    if(id){await api('PATCH','/api/admin/contents/'+id,body)}
    else{
      if(type!=='web'){
        if(!PICKED)throw new Error('Elige un archivo');
        const p=$('prog');p.style.display='block';
        const u=await upload(PICKED,f=>p.firstElementChild.style.width=(f*100)+'%');
        body.file=u.file;body.orig_name=u.orig_name;
      }
      const made=await api('POST','/api/admin/contents',body);
      if(type!=='web'&&PICKED){try{const tb=await makeThumb(PICKED,type);if(tb)await postThumb(made.id,tb)}catch(e){}}
    }
    closeModal();toast('Guardado');load();
  }catch(e){$('err').textContent=e.message;btn.disabled=false}
}

/* ---------------- Grupos (solo comunicaciones) ---------------- */
let GSIG='',OPENG=new Set();
function renderGroups(force){
  if(!S.is_super)return;
  const a=document.activeElement;
  if(!force&&a&&a.tagName==='INPUT'&&a.type==='text'&&$('v-groups').contains(a))return;
  const scr=S.screens.filter(x=>x.status==='approved').sort(byName),G=S.groups||[];
  const sig=JSON.stringify([G,scr.map(x=>[x.id,x.name,x.groups,x.online])]);
  if(!force&&sig===GSIG)return;GSIG=sig;
  let h=`<div class="note"><b>Grupos y nombres.</b> Una pantalla puede estar en varios grupos a la vez (por ejemplo, un Pasillo de la fama también está en «Segundo piso»). Los grupos se usan para filtrar las pantallas y para elegir a quién va un contenido. Los cambios se guardan al instante. «Todas» siempre existe y no necesita configuración.</div>
  <h2>Grupos</h2>
  <div class="card" style="margin-bottom:14px"><div class="row"><input type="text" id="g-new" placeholder="Nombre del nuevo grupo" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')createGroup()"><button class="btn pri" onclick="createGroup()">+ Crear grupo</button></div></div>`;
  h+=G.map((g,i)=>{
    const mem=new Set(g.members);
    return `<details class="card gcard" ${OPENG.has(g.id)?'open':''} ontoggle="grpToggled('${g.id}',this.open)" style="margin-bottom:10px"><summary class="row" style="cursor:pointer;gap:10px"><b style="font-size:15px">${esc(g.name)}</b><span class="badge gray">${g.members.length} pantalla${g.members.length===1?'':'s'}</span></summary>
    <div class="row" style="margin:12px 0 8px;flex-wrap:wrap"><input type="text" id="gn-${g.id}" value="${esc(g.name)}" maxlength="40" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')renameGroup('${g.id}')">
      <button class="btn sm pri" onclick="renameGroup('${g.id}')">Guardar nombre</button>
      <button class="btn sm" ${i?'':'disabled'} onclick="moveGroup('${g.id}',-1)" title="Subir">▲</button><button class="btn sm" ${i<G.length-1?'':'disabled'} onclick="moveGroup('${g.id}',1)" title="Bajar">▼</button>
      <button class="btn sm bad" onclick="deleteGroup('${g.id}')">Eliminar grupo</button></div>
    <div class="hint" style="margin:6px 0">Pantallas de este grupo:</div>
    <div class="gmem" id="gm-${g.id}">${scr.map(sc=>`<label class="chk"><input type="checkbox" value="${sc.id}" ${mem.has(sc.id)?'checked':''} onchange="saveMembers('${g.id}')"> ${esc(sc.name)} <span class="badge gray">${ORI_SHORT[sc.orientation]||'horizontal'}</span></label>`).join('')}</div></details>`}).join('')||'<div class="card empty">Aún no hay grupos.</div>';
  h+=`<h2 style="margin-top:26px">Nombres de las pantallas</h2><div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Pantalla</th><th>Grupos</th><th></th></tr></thead><tbody>`+
  scr.map(sc=>`<tr><td><input type="text" id="sn-${sc.id}" value="${esc(sc.name)}" maxlength="60" style="min-width:200px" onkeydown="if(event.key==='Enter')renameScreen('${sc.id}')"><div class="s" style="margin-top:3px">${sc.online?'En línea':'Sin conexión'}${sc.lan_ip?' · '+esc(sc.lan_ip):''}</div></td>
  <td><div style="display:flex;flex-wrap:wrap;gap:4px">${sGroups(sc).map(n=>`<span class="badge">${esc(n)}</span>`).join('')||'<span class="badge warn">Sin grupo</span>'}</div></td>
  <td><button class="btn sm pri" onclick="renameScreen('${sc.id}')">Guardar nombre</button></td></tr>`).join('')+'</tbody></table></div>';
  $('v-groups').innerHTML=h;
}
function grpToggled(id,o){o?OPENG.add(id):OPENG.delete(id)}
async function grpDo(fn,msg){try{await fn();if(msg)toast(msg);await load();renderGroups(true)}catch(e){toast(e.message)}}
function createGroup(){const n=$('g-new').value.trim();if(!n)return toast('Escribe el nombre del grupo');grpDo(async()=>{const r=await api('POST','/api/admin/groups',{name:n});OPENG.add(r.id)},'Grupo creado')}
function renameGroup(id){grpDo(()=>api('PATCH','/api/admin/groups/'+id,{name:$('gn-'+id).value}),'Nombre guardado')}
function moveGroup(id,d){grpDo(()=>api('PATCH','/api/admin/groups/'+id,{move:d}))}
function saveMembers(id){const m=[...document.querySelectorAll('#gm-'+id+' input:checked')].map(x=>x.value);grpDo(()=>api('PATCH','/api/admin/groups/'+id,{members:m}),'Guardado')}
function deleteGroup(id){const g=(S.groups||[]).find(x=>x.id===id);confirmBox('Eliminar grupo','El grupo «'+esc(g.name)+'» se eliminará. Las pantallas no se borran, pero los contenidos dirigidos a este grupo dejarán de llegar a ellas (revisa la pestaña Contenido) y los administradores perderán el acceso que tenían por este grupo.','Eliminar',()=>grpDo(()=>api('DELETE','/api/admin/groups/'+id),'Grupo eliminado'))}
function renameScreen(id){const n=$('sn-'+id).value.trim();if(!n)return toast('El nombre no puede estar vacío');grpDo(()=>api('PATCH','/api/admin/screens/'+id,{name:n}),'Nombre guardado')}

/* ---------------- Modal / render ---------------- */
function openModal(h){$('modal').className='modal';$('modal').innerHTML=h;$('mbg').classList.add('show')}
function closeModal(){$('mbg').classList.remove('show');render()}
function render(){if(TAB==='groups'){renderGroups();return}if(TAB==='screens')renderScreens();else if(TAB==='contents')renderContents();else if(TAB==='app')renderApp();else if(TAB==='admins')renderAdmins();else if(TAB==='help')renderHelp();else renderFallback()}
load();setInterval(load,5000);
</script>
</body>
